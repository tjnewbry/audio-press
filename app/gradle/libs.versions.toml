[versions]
agp = "9.0.1"
kotlin = "2.4.21"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
composeBom = "2026.03.01"
junit = "4.13.2"
spotless = "8.10.4"
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version = "2.0.27.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
# Replaces the BouncyCastle 1.72 that pdfbox-android pulls in (known CVEs); see app/pdf-source/build.gradle.kts.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.86" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.86" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version = "1.86" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
